<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Ejercicio 12</title>
    <link rel="stylesheet" href="css/ejercicio12.css">
    <script src="js/ejercicio12.js"></script>
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Convertidor</h1>
        <p class="subtitulo">Sheinbaum coins a Dólares</p>
            <div style="text-align: center;">
                <img class="imagen" src="img/mexico.png" >
            </div>
        <form class="formulario">
            <!--Donde el usuario ingresa los pesillos-->
            <div class="grupo-formulario">
                <label for="pesos">Pesos que deseas convertir</label>
                <input type="number" id="pesos" placeholder="Ej: 25 pesos" required>
            </div>
            <!--Botón q convierte-->
            <br>
                <button type="button" class="boton-convertir" onclick="convertir()">Convertir</button>
            <br>
            <div>
                <label for="resultado">Resultado</label>
                <input type="text" id="resultado" placeholder="Resultado" readonly>
            </div>
        </form>
    </div>
</body>
</html>
